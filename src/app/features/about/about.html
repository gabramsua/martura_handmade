@if (settings$ | async; as settings) {
  <section class="about-page">
    <div class="about-intro section-heading">
      <p class="eyebrow">Sobre mí</p>
      <h1>{{ settings.aboutTitle }}</h1>
      <p>{{ settings.aboutBody }}</p>
    </div>

    <div class="about-layout">
      @for (article of settings.aboutArticles; track article.id) {
        <article class="about-card">
          <span>{{ article.eyebrow }}</span>
          <strong>{{ article.title }}</strong>
          <p>{{ article.body }}</p>
        </article>
      }
    </div>

    <!-- <div class="about-actions">
      <a class="button primary" routerLink="/catalogo">Ir al catálogo</a>
      <a class="button ghost" routerLink="/consultas">Hacer una consulta</a>
    </div> -->
  </section>
}
